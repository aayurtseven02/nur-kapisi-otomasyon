name: Otonom İçerik Yayınlama

# Bu workflow TAMAMEN ÜCRETSİZDİR:
#  - Public repo'da GitHub Actions dakika limiti yoktur.
#  - Private repo'da ayda 2000 dakika ücretsiz kota vardır (bu pipeline için fazlasıyla yeterli).
#
# Ne yapar:
#  1) Her 30 dakikada bir (ve istenirse elle) tetiklenir.
#  2) config/schedule.yaml içinde yayın zamanı yaklaşmış (varsayılan: 6 saat içinde)
#     ve durumu "pending" olan EN FAZLA 1 videoyu üretir.
#  3) Videoyu "private" + zamanlanmış (publishAt) olarak YouTube'a yükler.
#     Gerçek "herkese açık yayın" anını YouTube'un kendi altyapısı yönetir.
#  4) config/schedule.yaml'daki durumu ("done"/"failed") repoya geri commit'ler.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      no_upload:
        description: "true ise YouTube'a yüklemeden sadece üretir (test modu)"
        required: false
        default: "false"
      lead_time_hours:
        description: "Kaç saat öncesinden üretime başlansın"
        required: false
        default: "6"

concurrency:
  group: islami-otomasyon-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Uzun sure (ör. 20 ayet) videoları birkaç dakika sürebilir; 60 dk
    # sınırı bazı uzun içerikler için yetersiz kalabiliyordu.
    timeout-minutes: 90
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg önbelleğini geri yükle
        # ffmpeg'i apt ile KURMUYORUZ. GitHub runner'larında `apt-get update`
        # zaman zaman sessizce asılı kalıyor (izlenen gerçek olaylar:
        # 2026-10-07 19:xx'te 50+ dk, 20:18 ve 20:46'daki iki koşuda 10 dk
        # zaman aşımı). `concurrency.cancel-in-progress: false` olduğu için
        # asılı kalan bir koşu SONRAKİ TÜM koşuları kuyrukta bekletiyor.
        # Bu yüzden tek kaynak: hazır statik derleme (deterministik, ağ dışı
        # bağımlılığı yok). İlk koşuda indirilir, sonrakilerde önbellekten gelir.
        id: ff-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-gpl-v1

      - name: ffmpeg kur
        id: ff-install
        # NOT: Zaman aşımı bilinçli olarak kısa tutulur. Bir şey ters giderse
        # koşu hızlıca başarısız olur, kuyruk açık kalır.
        timeout-minutes: 15
        run: |
          set -uo pipefail
          FF_DIR="$HOME/.cache/ffmpeg-static"
          GITHUB_PATH="${GITHUB_PATH:-/dev/null}"
          mkdir -p "$FF_DIR"

          # 1) Sistemde zaten libass destekli bir ffmpeg + ffprobe var mı?
          #    NOT: Filtre listesini bir DOSYAYA yazıp grep'liyoruz. Doğrudan
          #    `ffmpeg -filters | grep -q` kullanmak `pipefail` altında hatalı
          #    sonuç verir: grep -q eşleşmeyi bulunca hemen çıkar, ffmpeg ise
          #    SIGPIPE ile ölr ve pipefail boru hattını "başarısız" sayar.
          have_system=0
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -hide_banner -filters >/tmp/ff_filters.txt 2>/dev/null || true
            if grep -qE '\bsubtitles\b' /tmp/ff_filters.txt; then
              have_system=1
            fi
          fi
          rm -f /tmp/ff_filters.txt

          if [ -x "$FF_DIR/ffmpeg" ]; then
            echo "Önbellekteki statik ffmpeg kullanılıyor."
            echo "installed=false" >> "$GITHUB_OUTPUT"
          elif [ "$have_system" -eq 1 ]; then
            echo "Sistemdeki ffmpeg (libass destekli) kullanılıyor, indirme gerekmiyor."
            echo "installed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Uygun sistem ffmpeg'i yok; statik derleme indiriliyor (~149 MB)..."
            curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 \
              -o /tmp/ffmpeg.tar.xz \
              "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz" \
              || { echo "HATA: ffmpeg indirilemedi (ağ sorunu)."; exit 1; }
            # Sadece ihtiyacımız olan iki ikiliyi çıkarıyoruz (ffplay ve kütüphanelere
            # gerek yok) — disk kullanımını ~505 MB'tan ~336 MB'a düşürür.
            rm -rf /tmp/ff-extract && mkdir -p /tmp/ff-extract
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ff-extract --strip-components=1 \
                --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' \
              || { echo "HATA: ffmpeg arşivi açılamadı."; exit 1; }
            rm -f /tmp/ffmpeg.tar.xz
            install -m 0755 /tmp/ff-extract/bin/ffmpeg "$FF_DIR/ffmpeg" \
              || { echo "HATA: ffmpeg kurulamadı (disk dolu olabilir)."; exit 1; }
            install -m 0755 /tmp/ff-extract/bin/ffprobe "$FF_DIR/ffprobe" \
              || { echo "HATA: ffprobe kurulamadı (disk dolu olabilir)."; exit 1; }
            rm -rf /tmp/ff-extract
            echo "installed=true" >> "$GITHUB_OUTPUT"
          fi

          # Bu adımın kendi kabuğunda da görünür olsun (sonraki adımlar
          # $GITHUB_PATH sayesinde görür).
          export PATH="$FF_DIR:$PATH"
          echo "$FF_DIR" >> "$GITHUB_PATH"

          echo "--- doğrulama ---"
          ffmpeg -version | head -1
          ffprobe -version | head -1
          command -v ffmpeg >/dev/null 2>&1 || { echo "HATA: ffmpeg bulunamadı!"; exit 1; }
          command -v ffprobe >/dev/null 2>&1 || { echo "HATA: ffprobe bulunamadı!"; exit 1; }
          ffmpeg -hide_banner -filters >/tmp/ff_filters.txt 2>/dev/null || true
          grep -qE '\bsubtitles\b' /tmp/ff_filters.txt \
            && echo "OK: subtitles (libass) filtresi mevcut" \
            || { echo "HATA: ffmpeg libass (subtitles) desteği olmadan kurulu!"; exit 1; }
          rm -f /tmp/ff_filters.txt

      - name: ffmpeg önbelleğine kaydet
        if: steps.ff-install.outputs.installed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-gpl-v1

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Scheduler'ı çalıştır
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # workflow_dispatch girdileri doğrudan kabuk metnine gömülmek yerine
          # ortam değişkeni üzerinden aktarılır (GitHub'in önerdiği güvenli
          # yöntem — kabuk enjeksiyonunu önler).
          INPUT_NO_UPLOAD: ${{ github.event.inputs.no_upload }}
          INPUT_LEAD_HOURS: ${{ github.event.inputs.lead_time_hours }}
        run: |
          EXTRA_ARGS=""
          if [ "$INPUT_NO_UPLOAD" = "true" ]; then
            EXTRA_ARGS="--no-upload"
          fi
          LEAD="$INPUT_LEAD_HOURS"
          if [ -z "$LEAD" ]; then LEAD=6; fi
          python -m src.scheduler --lead-time-hours "$LEAD" --max-videos 1 $EXTRA_ARGS

      - name: Üretilen videoları artifact olarak sakla (yedek/inceleme)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_id }}
          # SADECE son ürünler (final video + kapak). Ara dosyalar
          # (output/<id>/ norm_*.mp4, muxed.mp4, narration.mp3 ...) yüklenmez:
          # tek koşu ~580 MB üretiyordu, 124 video için kota dolup koşular
          # başarısız olacaktı. Final mp4 + thumb ~50 MB.
          path: |
            output/*.mp4
            output/*_thumb.jpg
          retention-days: 7
          if-no-files-found: ignore

      - name: Takvim durumunu repoya geri yaz
        run: |
          git config user.name "islami-otomasyon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/schedule.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: schedule durumu güncellendi [skip ci]"
            git push
          else
            echo "Değişiklik yok, commit atlanıyor."
          fi
