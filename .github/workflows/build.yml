name: Windows uygulamasını derle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/build.yml', 'NuGet.Config']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Windows paketini hazırla
        shell: pwsh
        run: dotnet publish src/AnkaStudio.csproj -c Release -r win-x64 --self-contained true -o dist/AnkaStudio
      - name: Çekirdek testlerini çalıştır
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/AnkaStudio/TubeFlow.exe -ArgumentList '--self-test','--report',"$PWD/test-report.txt" -Wait -PassThru
          Get-Content test-report.txt
          if ($p.ExitCode -ne 0) { throw 'Çekirdek testi başarısız' }
      - name: Kaynak ve video motorunu ekle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/AnkaStudio/repository/src,dist/AnkaStudio/repository/.github/workflows,dist/AnkaStudio/tools | Out-Null
          Copy-Item src/*.cs,src/*.csproj dist/AnkaStudio/repository/src
          Copy-Item .github/workflows/*.yml dist/AnkaStudio/repository/.github/workflows
          Copy-Item NuGet.Config,README.md,ROADMAP.md,.gitignore dist/AnkaStudio/repository
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg
          $root = Get-ChildItem ffmpeg -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)/bin/ffmpeg.exe","$($root.FullName)/bin/ffprobe.exe" dist/AnkaStudio/tools
          Copy-Item "$($root.FullName)/LICENSE" dist/AnkaStudio/tools/FFmpeg-LICENSE.txt
          Copy-Item README.md,ROADMAP.md dist/AnkaStudio
      - uses: actions/upload-artifact@v4
        with:
          name: AnkaStudio-Windows-x64
          path: dist/AnkaStudio/
          retention-days: 14
