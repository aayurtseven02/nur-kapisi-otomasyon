# ==========================================================
# YAYIN TAKVİMİ
# Bu dosya sizin "programınız"dır. Her girdi bir videoyu temsil eder.
# scheduler.py bu listeyi tarar, zamanı gelen (publish_at <= şimdi + lead_time
# ve status: pending olan) görevleri bulup pipeline.py'yi tetikler ve
# status alanını "done" (veya hata olursa "failed") olarak günceller.
#
# format: "long"  -> normal yatay video (16:9)
# format: "short" -> YouTube Shorts (9:16, <=59sn)
#
# type alanına göre content modülü otomatik veri çeker:
#   sure   -> Kur'an sureleri/ayetleri (gerçek hafız sesi + Diyanet meali)
#   hadis  -> Hadis-i şerif (gerçek, kaynak gösterilen hadis metni)
#   dua    -> Hısnu'l Müslim duaları
#   hikaye -> Dini kıssa/hikaye (GÜVENLİK: metin burada veya text_file ile
#             SİZİN tarafınızdan sağlanır; uydurma içerik üretilmez)
#
# YENİ VİDEO EKLEMEK İÇİN: aşağıya aynı formatta yeni bir "- id: ..." bloğu
# ekleyin. status her zaman "pending" olarak başlamalı.
# ==========================================================

videos:
  - id: "2026-10-07-yasin-1-20"
    status: "test_paused"
    publish_at: "2026-10-07T07:00:00+03:00"
    format: "long"
